name: Release

# Publishes to npm when a GitHub release is published, through npm trusted publishing
# (OIDC, with provenance); no token is stored. The tag must match package.json (for example v0.1.1).
# A version that is already on npm is skipped, so re-running a release is safe.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm release that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - name: Publish unless this version is already on npm
        run: |
          if npm view "freetheai@${VERSION}" version >/dev/null 2>&1; then
            echo "freetheai@${VERSION} is already published; skipping."
          else
            npm publish --provenance --access public
          fi
